<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нажми на кнопку</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #1a1a2e;
    font-family: Arial, sans-serif;
  }

  /* Зелёная кнопка "НАЖМИ" по центру экрана */
  #startBtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #2ecc71;
    color: white;
    border: none;
    padding: 20px 60px;
    font-size: 24px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 6px 0 #27ae60, 0 10px 20px rgba(0,0,0,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
  }

  #startBtn:active {
    transform: translate(-50%, calc(-50% + 4px));
    box-shadow: 0 2px 0 #27ae60, 0 4px 10px rgba(0,0,0,0.4);
  }

  /* Счётчик, появляющийся в случайном месте */
  #counter {
    position: absolute;
    display: none;
    background: #f1c40f;
    color: #1a1a2e;
    font-size: 32px;
    font-weight: bold;
    padding: 20px 40px;
    border-radius: 50%;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    transition: transform 0.1s;
  }

  #counter:active {
    transform: scale(0.92);
  }
</style>
</head>
<body>

  <!-- Стартовая кнопка -->
  <button id="startBtn">НАЖМИ</button>

  <!-- Счётчик (изначально скрыт) -->
  <div id="counter">0</div>

<script>
  const startBtn = document.getElementById('startBtn');
  const counter = document.getElementById('counter');
  let count = 0;

  // Функция перемещения счётчика в случайное место на экране
  function moveRandomly() {
    const rect = counter.getBoundingClientRect();
    const maxX = window.innerWidth - rect.width;
    const maxY = window.innerHeight - rect.height;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    counter.style.left = x + 'px';
    counter.style.top = y + 'px';
  }

  // Клик по кнопке "НАЖМИ"
  startBtn.addEventListener('click', () => {
    // Скрываем стартовую кнопку
    startBtn.style.display = 'none';

    // Показываем счётчик и ставим его в случайное место
    counter.style.display = 'block';
    moveRandomly();

    // Сбрасываем счётчик
    count = 0;
    counter.textContent = count;
  });

  // Клик по счётчику — увеличиваем число и перемещаем его
  counter.addEventListener('click', () => {
    count++;
    counter.textContent = count;
    moveRandomly();
  });

  // При изменении размера окна следим, чтобы счётчик не улетел за границы
  window.addEventListener('resize', () => {
    if (counter.style.display === 'block') {
      const rect = counter.getBoundingClientRect();
      if (rect.right > window.innerWidth || rect.bottom > window.innerHeight) {
        moveRandomly();
      }
    }
  });
</script>

</body>
</html>
